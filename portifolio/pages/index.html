<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="stylesheet" href="../styles/style.css">
    <title>Gabriel Vinícius | Portfólio</title>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="#sobre" class="nav-link">Sobre</a>
            <a href="#formacao" class="nav-link">Formação</a>
            <a href="#experiencia" class="nav-link">Experiência</a>
            <a href="#projetos" class="nav-link">Projetos</a>
            <a href="#certificacoes" class="nav-link">Cursos</a> <a href="#habilidades" class="nav-link">Habilidades</a>
        </div>

    <main class="site-container">
        
        <section id="perfil-topo">
            <img src="../img/foto_perfil.png" alt="Foto de Gabriel Vinícius" id="foto-perfil">
            <h1 id="meuNome"></h1>
            <h2 id="tituloProfissional"></h2>
        </section>

        <section id="sobre" class="secao-conteudo">

        <section id="experiencia" class="secao-conteudo">
            <h2>Experiência Profissional</h2>
            <div id="lista-experiencia"></div>

        <section id="projetos" class="secao-conteudo">

            <div id="cards-projetos-container"></div>

        <section id="certificacoes" class="secao-conteudo">
            <h2>Cursos e Certificações</h2>
            <div id="lista-certificacoes"></div>
        </section>

        <section id="habilidades" class="secao-conteudo">
            <h2>Habilidades e Competências</h2>

    <footer class="site-footer">
